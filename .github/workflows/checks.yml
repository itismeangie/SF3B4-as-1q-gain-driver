name: Offline demo and syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax without executing research workflows
        run: python -m compileall -q 0* demo tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run the synthetic demo
        run: python demo/run_demo.py
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -print0)

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Parse R scripts without installing analysis packages or reading data
        run: Rscript --vanilla -e 'files <- Sys.glob("0*/*.R"); stopifnot(length(files) > 0); for (f in files) parse(file=f); cat(length(files), "R files parsed\n")'
